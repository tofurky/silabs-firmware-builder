name: Gemtek MXF-W1700K Zigbee Router
device: EFR32MG21A010F512IM32
base_project: src/zigbee_router
filename: "{manifest_name}_{sdk_version}"
sdk: "simplicity_sdk:2025.6.2"
toolchain: "12.2.1.20221205"

gbl:
  fw_type: zigbee_router
  baudrate: 115200

# The zigbee_router base project already includes:
#   - router_bootloader_cli: exposes "bootloader info" and "bootloader reboot"
#     CLI commands over UART, allowing the host to trigger a reboot into the
#     Gecko bootloader for OTA reflashing without a dedicated reset line.
#   - iostream_recommended_console: routes debug log output to the same UART,
#     so the host can observe stack diagnostics alongside the CLI.

c_defines:
  SL_ZIGBEE_APS_UNICAST_MESSAGE_COUNT: 32
  SL_ZIGBEE_BINDING_TABLE_SIZE: 32
  SL_ZIGBEE_BROADCAST_TABLE_SIZE: 64
  SL_ZIGBEE_MAX_END_DEVICE_CHILDREN: 32
  SL_ZIGBEE_SOURCE_ROUTE_TABLE_SIZE: 200

  SL_ZIGBEE_CHILD_TABLE_SIZE:
    type: c_flag
    value: 32

  SL_ZIGBEE_ROUTE_TABLE_SIZE:
    type: c_flag
    value: 250

  SL_IOSTREAM_USART_VCOM_BAUDRATE: 115200
  SL_IOSTREAM_USART_VCOM_FLOW_CONTROL_TYPE: usartHwFlowControlNone

  SL_IOSTREAM_USART_VCOM_PERIPHERAL: USART0
  SL_IOSTREAM_USART_VCOM_PERIPHERAL_NO: 0

  SL_IOSTREAM_USART_VCOM_TX_PORT: gpioPortA
  SL_IOSTREAM_USART_VCOM_TX_PIN:  5
  SL_IOSTREAM_USART_VCOM_RX_PORT: gpioPortA
  SL_IOSTREAM_USART_VCOM_RX_PIN:  6

  SL_IOSTREAM_USART_VCOM_RX_BUFFER_SIZE: 128

  #                            G     E     M     T     E     K     M     X     F     -     W     1     7     0     0     K
  SL_APPLICATION_PRODUCT_ID: '{0x47, 0x45, 0x4d, 0x54, 0x45, 0x4b, 0x4d, 0x58, 0x46, 0x2d, 0x57, 0x31, 0x37, 0x30, 0x30, 0x4b}'
